<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .error-container {
            background-color: #fff3f3;
            border-left: 4px solid #e74c3c;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .error-type {
            color: #e74c3c;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .error-message {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
        .back-link:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>URL Shortener - Error</h1>
    
    <div class="error-container">
        <div class="error-type">{{ error }}</div>
        <div class="error-message">{{ message }}</div>
        <p>We apologize for the inconvenience. Please try again later or contact support if the problem persists.</p>
    </div>
    
    <a href="/" class="back-link">Return to Home</a>
</body>
</html>
