version: '3.8'

services:
  web:
    build: .
    ports:
      - "5002:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/url_shortener
      - FLASK_ENV=production
    depends_on:
      - db
    restart: always
    volumes:
      - ./:/app
    command: gunicorn -b :8080 app:app

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=url_shortener
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
